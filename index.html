<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Chat</title>
    <script src="https://cdn.shushubuyue.net/ajax/libs/tailwindcss/3.4.16/tailwind.min.js"></script>
    <script src="https://cdn.shushubuyue.net/ajax/libs/vue/3.5.11/vue.global.js"></script>
    <script src="https://cdn.shushubuyue.net/ajax/libs/axios/1.7.2/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #2d2d2d;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e0e0e0;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d0d0d0;
        }
        
        /* 打字机光标 */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .typing-cursor::after {
            content: '▌';
            display: inline-block;
            animation: blink 1s infinite;
            color: #8b5cf6;
            margin-left: 2px;
            font-weight: normal;
        }
        
        /* Markdown 样式 */
        .markdown-body {
            line-height: 1.7;
            word-wrap: break-word;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .markdown-body h1 { font-size: 1.5rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body h3 { font-size: 1.1rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body pre {
            background: #f6f8fa;
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .markdown-body code {
            background: #f6f8fa;
            padding: 0.125rem 0.25rem;
            border-radius: 3px;
            font-size: 0.875rem;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 3px solid #8b5cf6;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #666;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e0e0e0;
            padding: 0.5rem;
            text-align: left;
        }
        .markdown-body th {
            background: #f6f8fa;
            font-weight: 600;
        }
        
        /* 移动端优化 */
        @media (max-width: 768px) {
            .desktop-only {
                display: none !important;
            }
            .mobile-menu {
                display: block !important;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-menu {
                display: none !important;
            }
        }
        
        /* 输入框自动调整高度 */
        textarea {
            field-sizing: content;
            min-height: 56px;
            max-height: 200px;
        }
        
        /* 消息动画 */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-enter {
            animation: slideIn 0.3s ease-out;
        }
        
        /* 加载动画 */
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b5cf6;
            animation: loading 1.4s infinite both;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes loading {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* 设置面板动画 */
        .slide-enter {
            transform: translateX(100%);
        }
        .slide-enter-active {
            transition: transform 0.3s ease-out;
        }
        .slide-enter-to {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div id="app" v-cloak class="flex flex-col h-screen">
        <!-- 顶部栏 - 固定高度 -->
        <header class="flex-shrink-0 border-b border-gray-200 bg-white">
            <div class="flex items-center justify-between h-14 px-4 md:px-6">
                <!-- Logo 和标题 -->
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span class="font-semibold text-gray-900">Gemini Chat</span>
                </div>
                
                <!-- 右侧按钮组 -->
                <div class="flex items-center space-x-2">
                    <!-- 新对话按钮 - 桌面端 -->
                    <button @click="newChat" 
                            class="desktop-only px-3 py-1.5 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                        新对话
                    </button>
                    
                    <!-- 设置按钮 -->
                    <button @click="showSettings = !showSettings"
                            class="p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- 主内容区 - 可滚动 -->
        <main class="flex-1 overflow-hidden flex flex-col">
            <!-- 聊天消息区域 -->
            <div ref="messagesContainer" class="flex-1 overflow-y-auto">
                <div class="max-w-3xl mx-auto px-4 py-6 md:py-12">
                    <!-- 欢迎消息 -->
                    <div v-if="messages.length === 0" class="text-center py-12">
                        <div class="inline-flex items-center justify-center w-16 h-16 mb-4 bg-violet-100 rounded-2xl">
                            <svg class="w-8 h-8 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-semibold text-gray-900 mb-2">开始对话</h2>
                        <p class="text-gray-600 max-w-md mx-auto">我是 Gemini 助手，有什么可以帮助您的吗？</p>
                    </div>
                    
                    <!-- 消息列表 -->
                    <div class="space-y-6">
                        <div v-for="(msg, index) in messages" :key="index" class="message-enter">
                            <!-- 用户消息 -->
                            <div v-if="msg.role === 'user'" class="flex justify-end mb-4">
                                <div class="flex items-start space-x-2 max-w-[85%] md:max-w-[70%]">
                                    <div class="bg-violet-600 text-white rounded-2xl px-4 py-2.5 shadow-sm">
                                        <p class="whitespace-pre-wrap break-words">{{ msg.content }}</p>
                                    </div>
                                    <div class="flex-shrink-0 w-8 h-8 bg-violet-600 rounded-full flex items-center justify-center">
                                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- AI 消息 -->
                            <div v-else class="flex mb-4">
                                <div class="flex items-start space-x-2 max-w-[85%] md:max-w-[70%]">
                                    <div class="flex-shrink-0 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                                  d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                        </svg>
                                    </div>
                                    <div class="bg-gray-50 rounded-2xl px-4 py-2.5 shadow-sm">
                                        <div class="markdown-body text-gray-800" v-html="msg.html || renderMarkdown(msg.displayContent || msg.content)"></div>
                                        <span v-if="msg.isStreaming" class="typing-cursor"></span>
                                        <div v-if="msg.error" class="text-red-500 text-sm mt-2">{{ msg.error }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 加载指示器 -->
                        <div v-if="isLoading && !currentStreamingMessage" class="flex mb-4">
                            <div class="flex items-start space-x-2">
                                <div class="flex-shrink-0 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                              d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>
                                </div>
                                <div class="bg-gray-50 rounded-2xl px-4 py-3 shadow-sm">
                                    <div class="loading-dots flex space-x-1">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 输入区域 - 固定底部 -->
            <div class="flex-shrink-0 border-t border-gray-200 bg-white">
                <div class="max-w-3xl mx-auto px-4 py-3 md:py-4">
                    <div class="flex items-end space-x-2">
                        <!-- 移动端新对话按钮 -->
                        <button @click="newChat" 
                                class="mobile-menu flex-shrink-0 p-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </button>
                        
                        <!-- 输入框容器 -->
                        <div class="flex-1 relative">
                            <textarea v-model="inputMessage" 
                                    @keydown="handleKeyDown"
                                    @input="handleInput"
                                    :disabled="isLoading"
                                    placeholder="输入消息..."
                                    rows="1"
                                    class="w-full px-4 py-3 pr-14 bg-gray-50 border border-gray-200 rounded-2xl resize-none 
                                           text-gray-900 placeholder-gray-500 
                                           focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent
                                           disabled:opacity-50 disabled:cursor-not-allowed
                                           transition-all"></textarea>
                            
                            <!-- 发送/停止按钮组 -->
                            <div class="absolute right-2 bottom-2 flex items-center space-x-1">
                                <!-- 停止按钮 -->
                                <button v-if="isLoading && streamMode" 
                                        @click="stopStreaming"
                                        class="p-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                              d="M6 6h12v12H6z"></path>
                                    </svg>
                                </button>
                                
                                <!-- 发送按钮 -->
                                <button @click="sendMessage" 
                                        :disabled="!inputMessage.trim() || isLoading"
                                        class="p-2 rounded-full transition-all duration-200 transform"
                                        :class="inputMessage.trim() && !isLoading 
                                                ? 'bg-violet-600 hover:bg-violet-700 text-white hover:scale-110 shadow-lg' 
                                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'">
                                    <svg v-if="!isLoading" class="w-4 h-4 transition-transform"
                                         :class="inputMessage.trim() ? 'rotate-0' : 'rotate-0'"
                                         fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                                    </svg>
                                    <svg v-else class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" 
                                              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 快捷提示 - 仅桌面端显示 -->
                    <div class="desktop-only mt-2 text-xs text-gray-400 text-center">
                        按 Ctrl + Enter 发送（Mac: ⌘ + Enter）
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 设置面板 - 侧边滑出 -->
        <div v-if="showSettings" @click.self="showSettings = false" 
             class="fixed inset-0 bg-black bg-opacity-30 z-50 transition-opacity">
            <div class="absolute right-0 top-0 h-full w-80 max-w-full bg-white shadow-xl overflow-y-auto">
                <!-- 设置面板头部 -->
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold text-gray-900">设置</h3>
                        <button @click="showSettings = false" 
                                class="p-1 hover:bg-gray-100 rounded-lg transition-colors">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- 设置内容 -->
                <div class="px-6 py-4 space-y-6">
                    <!-- 模型选择 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">模型</label>
                        <select v-model="selectedModel" 
                                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg 
                                       text-gray-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                            <option v-for="model in models" :key="model.name" :value="model.name">
                                {{ model.displayName || model.name.split('/').pop() }}
                            </option>
                        </select>
                    </div>
                    
                    <!-- Temperature -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">Temperature</label>
                            <span class="text-sm text-gray-600">{{ temperature }}</span>
                        </div>
                        <input type="range" v-model="temperature" min="0" max="2" step="0.1"
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer 
                                      accent-violet-600">
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-500">精确</span>
                            <span class="text-xs text-gray-500">创造性</span>
                        </div>
                    </div>
                    
                    <!-- Max Tokens -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">最大长度</label>
                            <span class="text-sm text-gray-600">{{ maxTokens }}</span>
                        </div>
                        <input type="range" v-model="maxTokens" min="100" max="4096" step="100"
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer 
                                      accent-violet-600">
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-500">100</span>
                            <span class="text-xs text-gray-500">4096</span>
                        </div>
                    </div>
                    
                    <!-- 流式输出开关 -->
                    <div>
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-sm font-medium text-gray-700">流式输出</span>
                            <div class="relative">
                                <input type="checkbox" v-model="streamMode" class="sr-only">
                                <div class="w-11 h-6 bg-gray-200 rounded-full transition-colors"
                                     :class="streamMode ? 'bg-violet-600' : 'bg-gray-200'"></div>
                                <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full transition-transform"
                                     :class="streamMode ? 'translate-x-5' : 'translate-x-0'"></div>
                            </div>
                        </label>
                        <p class="text-xs text-gray-500 mt-1">实时显示 AI 回复内容</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    messages: [],
                    inputMessage: '',
                    isLoading: false,
                    selectedModel: 'models/gemini-2.0-flash-exp',
                    models: [],
                    temperature: 0.7,
                    maxTokens: 1024,
                    streamMode: true,
                    currentStreamingMessage: null,
                    showSettings: false
                }
            },
            mounted() {
                this.loadModels();
            },
            methods: {
                async loadModels() {
                    try {
                        const response = await axios.get('/api/models');
                        if (response.data.availableModels) {
                            this.models = response.data.availableModels;
                            if (this.models.length > 0 && !this.models.find(m => m.name === this.selectedModel)) {
                                this.selectedModel = this.models[0].name;
                            }
                        }
                    } catch (error) {
                        console.error('Failed to load models:', error);
                        // 使用默认模型列表
                        this.models = [
                            { name: 'models/gemini-2.0-flash-exp', displayName: 'Gemini 2.0 Flash' },
                            { name: 'models/gemini-1.5-pro', displayName: 'Gemini 1.5 Pro' },
                            { name: 'models/gemini-1.5-flash', displayName: 'Gemini 1.5 Flash' }
                        ];
                    }
                },
                
                handleKeyDown(event) {
                    // Ctrl+Enter 或 Cmd+Enter 发送消息
                    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                        event.preventDefault();
                        this.sendMessage();
                    }
                },
                
                handleInput(event) {
                    // 自动调整输入框高度
                    const textarea = event.target;
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
                },
                
                async sendMessage() {
                    if (!this.inputMessage.trim() || this.isLoading) return;
                    
                    const userMessage = {
                        role: 'user',
                        content: this.inputMessage.trim()
                    };
                    this.messages.push(userMessage);
                    
                    const prompt = this.inputMessage.trim();
                    this.inputMessage = '';
                    
                    // 重置输入框高度
                    this.$nextTick(() => {
                        const textarea = document.querySelector('textarea');
                        if (textarea) {
                            textarea.style.height = 'auto';
                        }
                    });
                    
                    this.isLoading = true;
                    
                    if (this.streamMode) {
                        this.streamChat(prompt);
                    } else {
                        await this.normalChat(prompt);
                    }
                },
                
                async normalChat(prompt) {
                    try {
                        const response = await axios.post('/api/generate', {
                            prompt: prompt,
                            temperature: parseFloat(this.temperature),
                            maxTokens: parseInt(this.maxTokens)
                        });
                        
                        const aiMessage = {
                            role: 'assistant',
                            content: response.data.response,
                            html: this.renderMarkdown(response.data.response)
                        };
                        this.messages.push(aiMessage);
                    } catch (error) {
                        const errorMessage = {
                            role: 'assistant',
                            content: '抱歉，发生了错误。',
                            error: error.response?.data?.error || error.message
                        };
                        this.messages.push(errorMessage);
                    } finally {
                        this.isLoading = false;
                        this.scrollToBottom();
                    }
                },
                
                streamChat(prompt) {
                    const aiMessage = {
                        role: 'assistant',
                        content: '',
                        html: '',
                        isStreaming: true,
                        displayContent: '',
                        fullContent: ''
                    };
                    this.messages.push(aiMessage);
                    this.currentStreamingMessage = aiMessage;
                    
                    const vm = this;
                    let pendingText = '';
                    let isTyping = false;
                    let typingSpeed = 15;
                    
                    const typeWriter = async () => {
                        if (isTyping || pendingText.length === 0) return;
                        isTyping = true;
                        
                        while (pendingText.length > 0 && aiMessage.isStreaming) {
                            const char = pendingText[0];
                            pendingText = pendingText.slice(1);
                            
                            aiMessage.displayContent += char;
                            aiMessage.html = vm.renderMarkdown(aiMessage.displayContent);
                            
                            vm.scrollToBottom();
                            
                            await new Promise(resolve => setTimeout(resolve, typingSpeed));
                        }
                        
                        isTyping = false;
                        
                        if (pendingText.length > 0) {
                            typeWriter();
                        }
                    };
                    
                    fetch(`/api/generate-stream`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            temperature: parseFloat(this.temperature),
                            maxTokens: parseInt(this.maxTokens)
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.body;
                    })
                    .then(body => {
                        const reader = body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        
                        const processStream = async () => {
                            try {
                                while (true) {
                                    const { done, value } = await reader.read();
                                    if (done) {
                                        if (pendingText.length > 0) {
                                            aiMessage.displayContent += pendingText;
                                            aiMessage.html = vm.renderMarkdown(aiMessage.displayContent);
                                        }
                                        vm.finishStreaming();
                                        break;
                                    }
                                    
                                    buffer += decoder.decode(value, { stream: true });
                                    const lines = buffer.split('\n');
                                    buffer = lines.pop() || '';
                                    
                                    for (const line of lines) {
                                        if (line.trim().startsWith('data: ')) {
                                            const data = line.slice(6).trim();
                                            if (data === '[DONE]') {
                                                if (pendingText.length > 0) {
                                                    aiMessage.displayContent += pendingText;
                                                    aiMessage.html = vm.renderMarkdown(aiMessage.displayContent);
                                                    pendingText = '';
                                                }
                                                vm.finishStreaming();
                                                return;
                                            }
                                            if (data) {
                                                try {
                                                    const parsed = JSON.parse(data);
                                                    const text = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                                                    if (text) {
                                                        aiMessage.fullContent += text;
                                                        aiMessage.content = aiMessage.fullContent;
                                                        pendingText += text;
                                                        typeWriter();
                                                    }
                                                } catch (e) {
                                                    console.log('Parse error:', e);
                                                }
                                            }
                                        }
                                    }
                                }
                            } catch (error) {
                                console.error('Stream processing error:', error);
                                aiMessage.error = '流式传输出错: ' + error.message;
                                if (pendingText.length > 0) {
                                    aiMessage.displayContent += pendingText;
                                    aiMessage.html = vm.renderMarkdown(aiMessage.displayContent);
                                }
                                vm.finishStreaming();
                            }
                        };
                        
                        processStream();
                    })
                    .catch(error => {
                        console.error('Stream error:', error);
                        aiMessage.error = '连接失败: ' + error.message;
                        vm.finishStreaming();
                    });
                },
                
                stopStreaming() {
                    this.finishStreaming();
                },
                
                finishStreaming() {
                    if (this.currentStreamingMessage) {
                        this.currentStreamingMessage.isStreaming = false;
                        this.currentStreamingMessage = null;
                    }
                    this.isLoading = false;
                    this.scrollToBottom();
                },
                
                renderMarkdown(text) {
                    if (!text) return '';
                    
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        headerIds: false,
                        mangle: false
                    });
                    
                    return marked.parse(text);
                },
                
                newChat() {
                    this.messages = [];
                    this.inputMessage = '';
                    this.isLoading = false;
                    this.currentStreamingMessage = null;
                    this.showSettings = false;
                },
                
                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.messagesContainer;
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                }
            }
        }).mount('#app');
    </script>
</body>
