<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Index — Gemini Proxy Demo</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#071036; --accent:#60a5fa; --glass: rgba(255,255,255,0.06);
      --card: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    body{
      background: radial-gradient(1200px 600px at 10% 10%, rgba(96,165,250,0.06), transparent 10%),
                  radial-gradient(800px 400px at 90% 80%, rgba(99,102,241,0.06), transparent 10%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color: #e6eef8; overflow:hidden;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }

    /* Fullscreen canvas for particles */
    #canvas{position:fixed;inset:0;z-index:0;display:block}

    .wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px;box-sizing:border-box}

    .panel{
      width:min(1100px,96%);display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center;
      backdrop-filter: blur(8px) saturate(120%);
    }

    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:18px;padding:36px;box-shadow: 0 10px 40px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03);
    }

    h1{font-size:clamp(28px,4vw,48px);margin:0 0 10px 0;line-height:1.02}
    .lead{color:rgba(230,238,248,0.8);margin-bottom:18px}

    .typed{color:var(--accent);font-weight:600}

    /* Morphing SVG blob */
    .blob-wrap{position:relative;height:220px}
    .blob{width:100%;height:100%}
    @keyframes blob-morph{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
    .blob svg{filter:drop-shadow(0 12px 30px rgba(2,6,23,0.7));animation:blob-morph 6s ease-in-out infinite}

    /* Floating cards */
    .cards{display:flex;flex-direction:column;gap:14px}
    .card{background:var(--card);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);transition:transform 300ms cubic-bezier(.2,.9,.2,1),box-shadow 300ms;transform-style:preserve-3d}
    .card:hover{transform:translateY(-8px) rotateX(2deg) rotateY(-2deg);box-shadow:0 24px 48px rgba(2,6,23,0.6)}

    /* Utilities */
    .muted{color:rgba(230,238,248,0.6);font-size:14px}
    .row{display:flex;gap:12px;align-items:center}

    /* Responsive */
    @media (max-width:920px){.panel{grid-template-columns:1fr;}.blob-wrap{height:160px}}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="wrap">
    <div class="panel">
      <section class="hero">
        <h1>欢迎来到 Gemini Proxy <span class="typed" id="typed"></span></h1>
        <p class="lead">一个演示页面，展示无外部依赖的现代动画：SVG 变形、粒子背景、漂浮卡片与交互式视差。</p>

        <div class="blob-wrap">
          <div class="blob">
            <svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="g1" x1="0" x2="1">
                  <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
                  <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.85"/>
                </linearGradient>
              </defs>
              <g transform="translate(300,200)">
                <path id="blobPath" fill="url(#g1)"></path>
              </g>
            </svg>
          </div>
        </div>

        <p class="muted">试着移动鼠标，你会看到卡片和 blob 的视差效果。页面无外部脚本，轻量且可自定义。</p>
      </section>

      <aside class="cards">
        <div class="card" data-tilt>
          <div class="row"><strong>实时粒子</strong><span class="muted"> — Canvas 驱动</span></div>
          <p class="muted">可调颗粒数量与连线效果。</p>
        </div>
        <div class="card" data-tilt>
          <div class="row"><strong>SVG Blob</strong><span class="muted"> — 平滑变形</span></div>
          <p class="muted">基于简单双曲函数的路径点噪声动画。</p>
        </div>
        <div class="card" data-tilt>
          <div class="row"><strong>交互视差</strong><span class="muted"> — 鼠标/触控</span></div>
          <p class="muted">卡片轻微倾斜以提高触感反馈。</p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // Authentication guard: require accessToken in localStorage and validate via /api/auth/me
    (async function authGuard(){
      const token = localStorage.getItem('accessToken');
      if(!token){ window.location.href = '/login'; return; }
      try{
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer '+token } });
        if(!res.ok){ localStorage.removeItem('accessToken'); localStorage.removeItem('refreshToken'); localStorage.removeItem('user'); window.location.href = '/login'; }
      }catch(e){ localStorage.removeItem('accessToken'); localStorage.removeItem('refreshToken'); localStorage.removeItem('user'); window.location.href = '/login'; }
    })();

    // Typed effect
    (function(){
      const words = ['Proxy', '演示', '高速', '轻量'];
      const el = document.getElementById('typed');
      let i=0, j=0, forward=true;
      function tick(){
        const word = words[i];
        el.textContent = word.slice(0,j);
        if(forward){ j++; if(j>word.length){ forward=false; setTimeout(tick,900); return }}
        else{ j--; if(j<0){ forward=true; i=(i+1)%words.length }}
        setTimeout(tick, forward?120:40);
      }
      tick();
    })();

    // Simple particle system
    (function(){
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let w=canvas.width=innerWidth, h=canvas.height=innerHeight;
      const N = Math.round((w*h)/35000); // scale particles with area
      const particles = [];

      function rand(min,max){return Math.random()*(max-min)+min}
      function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
      addEventListener('resize', resize);

      for(let i=0;i<N;i++) particles.push({x:Math.random()*w,y:Math.random()*h,vx:rand(-0.3,0.3),vy:rand(-0.3,0.3),r:rand(0.8,2.2)});

      function frame(){
        ctx.clearRect(0,0,w,h);
        for(let p of particles){
          p.x += p.vx; p.y += p.vy;
          if(p.x<0||p.x>w) p.vx *= -1;
          if(p.y<0||p.y>h) p.vy *= -1;
          ctx.beginPath();ctx.fillStyle='rgba(255,255,255,0.06)';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
        }
        for(let i=0;i<particles.length;i++){
          for(let j=i+1;j<particles.length;j++){
            const a=particles[i], b=particles[j];
            const dx=a.x-b.x, dy=a.y-b.y; const d=dx*dx+dy*dy;
            if(d<9000){ ctx.strokeStyle='rgba(96,165,250,'+(0.12 - d/18000)+')'; ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke() }
          }
        }
        requestAnimationFrame(frame);
      }
      frame();
    })();

    // SVG blob path generation
    (function(){
      const path = document.getElementById('blobPath');
      const pts = 8; let t = 0;
      function noise(x){ return (Math.sin(x*1.5 + t) + Math.cos(x*0.9 + t*0.7)) * 8 }
      function build(){ const R=120; let d=''; for(let i=0;i<pts;i++){ const theta=(i/pts)*Math.PI*2; const r=R+noise(i); const x=Math.cos(theta)*r; const y=Math.sin(theta)*r; d += (i===0? 'M':' L')+x+','+y } d+=' Z'; path.setAttribute('d', d); }
      function loop(){ t += 0.05; build(); requestAnimationFrame(loop); }
      loop();
    })();

    // Card tilt / parallax
    (function(){
      const cards = document.querySelectorAll('[data-tilt]');
      function onMove(e){
        const x = (e.clientX || (e.touches && e.touches[0].clientX) ) - innerWidth/2;
        const y = (e.clientY || (e.touches && e.touches[0].clientY) ) - innerHeight/2;
        const rx = (y / innerHeight) * 6; const ry = (x / innerWidth) * -6;
        for(const c of cards){ c.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)` }
      }
      addEventListener('mousemove', onMove); addEventListener('touchmove', onMove, {passive:true});
      addEventListener('mouseleave', ()=>{ for(const c of cards) c.style.transform = '' });
    })();
  </script>
</body>
</html>
