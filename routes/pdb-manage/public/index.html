- user_id: INTEGER NOT NULL
- total_amount: NUMERIC(10,2) NOT NULL
- order_date: TIMESTAMP NOT NULL`;
                        
                        setDatabaseSchema(exampleSchema + "\n\n注意：数据库连接失败，已使用示例结构。AI可能无法生成准确的SQL。");
                        return;
                    }
                    
                    // 数据库连接正常，加载实际表结构
                    const response = await fetch(`${API}/tables`);
                    const tablesData = await response.json();
                    
                    if (tablesData.success && tablesData.data && tablesData.data.length > 0) {
                        let schema = "数据库表结构信息：\n";
                        
                        // 显示前5个表的详细结构（减少API调用）
                        const tablesToLoad = tablesData.data.slice(0, 5);
                        
                        for (const table of tablesToLoad) {
                            try {
                                const structureResponse = await fetch(`${API}/tables/${table.table_name}/structure`);
                                const structureData = await structureResponse.json();
                                
                                if (structureData.success && structureData.data) {
                                    schema += `\n表名: ${table.table_name}\n`;
                                    structureData.data.forEach(col => {
                                        schema += `- ${col.column_name}: ${col.data_type}${col.character_maximum_length ? `(${col.character_maximum_length})` : ''} ${col.is_nullable === 'YES' ? 'NULL' : 'NOT NULL'}\n`;
                                    });
                                }
                            } catch (e) {
                                console.warn(`Failed to load structure for table ${table.table_name}:`, e);
                                schema += `\n表名: ${table.table_name}\n- (结构加载失败)\n`;
                            }
                        }
                        
                        if (tablesData.data.length > 5) {
                            schema += `\n... 还有 ${tablesData.data.length - 5} 个表`;
                        }
                        
                        setDatabaseSchema(schema);
                    } else {
                        // 数据库中没有表，使用默认schema
                        const defaultSchema = `数据库表结构信息：
当前数据库中没有检测到表结构。

建议：
1. 先创建一些表
2. 或在查询中明确指定表名

示例表结构：
表名: users
- id: SERIAL PRIMARY KEY NOT NULL
- username: VARCHAR(255) NOT NULL
- email: VARCHAR(255) NULL
- created_at: TIMESTAMP NOT NULL`;
                        
                        setDatabaseSchema(defaultSchema);
                    }
                } catch (error) {
                    console.error('Failed to load database schema:', error);
                    // 使用默认schema
                    const defaultSchema = `数据库表结构信息（默认）：
表名: users
- id: SERIAL PRIMARY KEY NOT NULL
- username: VARCHAR(255) NOT NULL
- email: VARCHAR(255) NULL
- created_at: TIMESTAMP NOT NULL

表名: products
- id: SERIAL PRIMARY KEY NOT NULL
- name: VARCHAR(255) NOT NULL
- price: NUMERIC(10,2) NOT NULL
- category_id: INTEGER NULL

注意：无法加载实际数据库结构，AI将基于示例结构生成SQL。`;
                    
                    setDatabaseSchema(defaultSchema);
                }
            };

            const generateSql = async () => {
                if (!aiPrompt.trim()) {
                    setErrorMessage('请输入SQL生成提示语');
                    return;
                }

                setAiLoading(true);
                setValidationResult(null);
                
                try {
                    const response = await fetch('/api/sql-generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: aiPrompt,
                            schema: databaseSchema,
                            model: selectedAiModel,
                            temperature: 0.7
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        setGeneratedSql(data.sql);
                        // 自动填充到SQL编辑器
                        setSql(data.sql);
                        setErrorMessage('');
                    } else {
                        setErrorMessage(data.error || 'AI生成SQL失败');
                    }
                } catch (error) {
                    setErrorMessage(`AI生成失败: ${error.message}`);
                } finally {
                    setAiLoading(false);
                }
            };

            const validateSql = async () => {
                if (!sql.trim()) {
                    setErrorMessage('请先输入SQL语句');
                    return;
                }

                setAiLoading(true);
                setValidationResult(null);
                
                try {
                    const response = await fetch('/api/sql-validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sql: sql,
                            model: selectedAiModel,
                            temperature: 0.3
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        setValidationResult(data);
                        setErrorMessage('');
                    } else {
                        setErrorMessage(data.error || 'AI语法检查失败');
                    }
                } catch (error) {
                    setErrorMessage(`AI语法检查失败: ${error.message}`);
                } finally {
                    setAiLoading(false);
                }
            };

            const handleTableSelect = async (tableName) => {
                setSelectedTable(tableName);
                setTableView('structure'); // 默认显示结构
                setTableData([]); // 清空之前的数据
                await loadTableStructure(tableName);
            };

            const switchTableView = async (view) => {
                if (view === tableView) return; // 如果已经是当前视图，不做任何操作
                
                setTableView(view);
                if (view === 'structure' && tableStructure.length === 0) {
                    await loadTableStructure(selectedTable);
                } else if (view === 'data' && tableData.length === 0) {
                    await loadTableData(selectedTable);
                }
            };

            const structureColumns = [
                { field: 'column_name', title: '列名' },
                { 
                    field: 'data_type', 
                    title: '数据类型',
                    formatter: (value) => <span className="tag tag-blue">{value}</span>
                },
                { 
                    field: 'is_nullable', 
                    title: '可空',
                    formatter: (value) => value === 'YES' 
                        ? <span className="tag tag-green">可空</span>
                        : <span className="tag tag-red">非空</span>
                },
                { field: 'column_default', title: '默认值' },
                { field: 'character_maximum_length', title: '最大长度' }
            ];

            return (
                <div className="min-h-screen">
                    {/* Error Toast */}
                    {errorMessage && (
                        <ErrorToast 
                            message={errorMessage} 
                            onClose={() => setErrorMessage('')}
                        />
                    )}

                    {/* Create Table Modal */}
                    {showCreateTable && (
                        <CreateTableModal
                            onClose={() => setShowCreateTable(false)}
                            onSuccess={() => {
                                setShowCreateTable(false);
                                loadAvailableTables();
                            }}
                            onError={setErrorMessage}
                        />
                    )}

                    {/* Table Selector Modal */}
                    {showTableSelector && (
                        <TableSelector
                            availableTables={availableTables}
                            selectedTables={selectedTables}
                            onTablesChange={setSelectedTables}
                            onLoad={loadSelectedTables}
                            onClose={() => setShowTableSelector(false)}
                        />
                    )}

                    {/* Header */}
                    <header className="glass sticky top-0 z-50 border-b border-white/20">
                        <div className="max-w-7xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold">
                                        DB
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                                            数据库管理中心
                                        </h1>
                                        <p className="text-sm text-gray-500">PostgreSQL Database Admin</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className={`w-2 h-2 rounded-full ${health ? 'bg-green-500 pulse' : 'bg-red-500'}`} />
                                    <span className="text-sm text-gray-600">
                                        {health ? '连接正常' : '连接断开'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-6 py-8">
                        {/* Tabs */}
                        <div className="card mb-8">
                            <div className="flex">
                                {['overview', 'tables', 'query', 'info'].map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`flex-1 px-6 py-4 font-medium transition-all ${
                                            activeTab === tab 
                                                ? 'text-blue-600 bg-blue-50 border-b-2 border-blue-600' 
                                                : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'
                                        }`}
                                    >
                                        {tab === 'overview' ? '概览' : 
                                         tab === 'tables' ? '数据表' : 
                                         tab === 'query' ? 'SQL查询' : '系统信息'}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Loading */}
                        {loading && (
                            <div className="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 flex items-center justify-center">
                                <div className="bg-white rounded-xl p-6 flex items-center gap-4">
                                    <div className="spinner" />
                                    <span>加载中...</span>
                                </div>
                            </div>
                        )}

                        {/* Overview Tab */}
                        {activeTab === 'overview' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 fade-in">
                                {[
                                    { label: '数据表', value: stats.tables, icon: '📊', color: 'blue' },
                                    { label: '索引', value: stats.indexes, icon: '🔍', color: 'green' },
                                    { label: '数据库大小', value: stats.databaseSize, icon: '💾', color: 'purple' },
                                    { label: '活跃连接', value: stats.activeConnections, icon: '🔗', color: 'orange' }
                                ].map((stat, i) => (
                                    <div key={i} className="card p-6">
                                        <div className="text-3xl mb-3">{stat.icon}</div>
                                        <p className="text-sm text-gray-500 mb-1">{stat.label}</p>
                                        <p className="text-3xl font-bold">{stat.value || '-'}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Tables Tab */}
                        {activeTab === 'tables' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
                                <div className="lg:col-span-1">
                                    <div className="card p-6">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-lg font-semibold">数据表列表</h3>
                                            <button
                                                onClick={() => setShowCreateTable(true)}
                                                className="px-3 py-1.5 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all text-sm"
                                            >
                                                + 新建表
                                            </button>
                                        </div>
                                        <div className="space-y-2 max-h-96 overflow-auto">
                                            {displayedTables.map(table => (
                                                <div
                                                    key={table.table_name}
                                                    onClick={() => handleTableSelect(table.table_name)}
                                                    className={`p-3 rounded-lg cursor-pointer transition-all ${
                                                        selectedTable === table.table_name
                                                            ? 'bg-blue-50 border border-blue-300'
                                                            : 'hover:bg-gray-50 border border-transparent'
                                                    }`}
                                                >
                                                    <div className="font-medium">{table.table_name}</div>
                                                    <div className="text-xs text-gray-500">Schema: {table.table_schema}</div>
                                                </div>
                                            ))}
                                            </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2">
                                    {selectedTable ? (
                                        <div className="card p-6">
                                            <div className="mb-6">
                                                <div className="flex items-center justify-between mb-4">
                                                    <h3 className="text-lg font-semibold">
                                                        表详情: <span className="text-blue-600">{selectedTable}</span>
                                                    </h3>
                                                    <button
                                                        onClick={() => {
                                                            setSelectedTable(null);
                                                            setTableStructure([]);
                                                            setTableData([]);
                                                        }}
                                                        className="text-gray-400 hover:text-gray-600"
                                                    >
                                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                                        </svg>
                                                    </button>
                                                </div>
                                                
                                                <div className="flex gap-2">
                                                    <div className="flex gap-2 p-1 bg-gray-100 rounded-lg flex-1">
                                                        <button
                                                            onClick={() => switchTableView('structure')}
                                                            className={`flex-1 px-4 py-2 rounded-md font-medium transition-all ${
                                                                tableView === 'structure'
                                                                    ? 'bg-white text-blue-600 shadow-sm'
                                                                    : 'text-gray-600 hover:text-gray-900'
                                                            }`}
                                                        >
                                                            表结构
                                                        </button>
                                                        <button
                                                            onClick={() => switchTableView('data')}
                                                            className={`flex-1 px-4 py-2 rounded-md font-medium transition-all ${
                                                                tableView === 'data'
                                                                    ? 'bg-white text-blue-600 shadow-sm'
                                                                    : 'text-gray-600 hover:text-gray-900'
                                                            }`}
                                                        >
                                                            表数据
                                                        </button>
                                                    </div>
                                                    <button
                                                        onClick={() => {
                                                            if (tableView === 'structure') {
                                                                loadTableStructure(selectedTable);
                                                            } else {
                                                                loadTableData(selectedTable);
                                                            }
                                                        }}
                                                        className="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition-colors"
                                                        title="刷新数据"
                                                    >
                                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="min-h-[400px]">
                                                {loading ? (
                                                    <div className="flex items-center justify-center py-20">
                                                        <div className="text-center">
                                                            <div className="spinner mx-auto mb-4" />
                                                            <p className="text-gray-500">
                                                                加载{tableView === 'structure' ? '表结构' : '表数据'}中...
                                                            </p>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    tableView === 'structure' ? (
                                                        <DataTable
                                                            data={tableStructure}
                                                            columns={structureColumns}
                                                            pageSize={10}
                                                            searchable={false}
                                                        />
                                                    ) : (
                                                        <DataTable
                                                            data={tableData}
                                                            columns={tableData.length > 0 ? 
                                                                Object.keys(tableData[0]).map(key => ({ field: key, title: key })) : 
                                                                []
                                                            }
                                                            pageSize={20}
                                                        />
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="card p-12 text-center text-gray-500">
                                            <svg className="w-24 h-24 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
                                            </svg>
                                            请选择一个表查看详情
                                    </div>
                                )}
                                </div>
                            </div>
                        )}

                        {/* Query Tab */}
                        {activeTab === 'query' && (
                            <div className="space-y-6 fade-in">
                                {/* AI助手面板 */}
                                <div className="card p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-semibold flex items-center gap-2">
                                            <svg className="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                                            </svg>
                                            AI SQL助手
                                        </h3>
                                        <button
                                            onClick={() => setShowAiPanel(!showAiPanel)}
                                            className="text-purple-600 hover:text-purple-800"
                                        >
                                            <svg className={`w-5 h-5 transition-transform ${showAiPanel ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                                            </svg>
                                        </button>
                                    </div>
                                    
                                    {showAiPanel && (
                                        <div className="space-y-4">
                                            {/* 模型选择器和参数设置 */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-2">AI模型</label>
                                                    <select
                                                        value={selectedAiModel}
                                                        onChange={(e) => setSelectedAiModel(e.target.value)}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                    >
                                                        {aiModels.map(model => (
                                                            <option key={model.name} value={model.name}>
                                                                {model.displayName || model.name}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    <button
                                                        onClick={loadAiModels}
                                                        className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition-colors text-sm"
                                                    >
                                                        刷新模型
                                                    </button>
                                                    <button
                                                        onClick={loadDatabaseSchema}
                                                        className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors text-sm"
                                                    >
                                                        刷新数据库结构
                                                    </button>
                                                </div>
                                            </div>

                                            {/* 数据库结构状态提示 */}
                                            <div className="text-xs text-gray-500 bg-gray-50 p-2 rounded">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                                    </svg>
                                                    <span className="font-medium">数据库结构状态：</span>
                                                </div>
                                                <div className="pl-6">
                                                    {databaseSchema ? (
                                                        <span className="text-green-600">
                                                            ✅ 已加载数据库结构信息（包含 {databaseSchema.split('表名:').length - 1} 个表）
                                                        </span>
                                                    ) : (
                                                        <span className="text-orange-600">
                                                            ⏳ 正在加载数据库结构...
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                            {/* AI提示语输入 */}
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-2">SQL生成提示语</label>
                                                <textarea
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none"
                                                    rows="3"
                                                    value={aiPrompt}
                                                    onChange={(e) => setAiPrompt(e.target.value)}
                                                    placeholder="例如：查询用户表中所有年龄大于25岁的用户信息，包括姓名、邮箱和注册时间"
                                                />
                                            </div>

                                            {/* AI操作按钮 */}
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={generateSql}
                                                    disabled={aiLoading || !aiPrompt.trim()}
                                                    className="px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white rounded-lg hover:from-purple-600 hover:to-pink-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                                                >
                                                    {aiLoading && <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />}
                                                    生成SQL
                                                </button>
                                                <button
                                                    onClick={validateSql}
                                                    disabled={aiLoading || !sql.trim()}
                                                    className="px-4 py-2 bg-gradient-to-r from-green-500 to-teal-600 text-white rounded-lg hover:from-green-600 hover:to-teal-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                                                >
                                                    {aiLoading && <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />}
                                                    语法检查
                                                </button>
                                            </div>

                                            {/* AI生成结果 */}
                                            {generatedSql && (
                                                <div className="border border-purple-200 rounded-lg p-4 bg-purple-50">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <h4 className="font-medium text-purple-800">AI生成的SQL</h4>
                                                        <button
                                                            onClick={() => setGeneratedSql('')}
                                                            className="text-purple-600 hover:text-purple-800"
                                                        >
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                    <div className="bg-gray-900 text-gray-100 rounded p-3 font-mono text-sm">
                                                        <pre className="whitespace-pre-wrap">{generatedSql}</pre>
                                                    </div>
                                                </div>
                                            )}

                                            {/* AI语法检查结果 */}
                                            {validationResult && (
                                                <div className={`border rounded-lg p-4 ${
                                                    validationResult.isCorrect 
                                                        ? 'border-green-200 bg-green-50' 
                                                        : 'border-red-200 bg-red-50'
                                                }`}>
                                                    <div className="flex items-center gap-2 mb-2">
                                                        {validationResult.isCorrect ? (
                                                            <svg className="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                            </svg>
                                                        ) : (
                                                            <svg className="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                            </svg>
                                                        )}
                                                        <h4 className={`font-medium ${
                                                            validationResult.isCorrect ? 'text-green-800' : 'text-red-800'
                                                        }`}>
                                                            {validationResult.isCorrect ? '语法检查通过' : '发现语法问题'}
                                                        </h4>
                                                    </div>
                                                    <div className="text-sm whitespace-pre-wrap">
                                                        {validationResult.validationResult}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* SQL编辑器 */}
                                <div className="card p-6">
                                    <h3 className="text-lg font-semibold mb-4">SQL 查询编辑器</h3>
                                    <textarea
                                        className="sql-editor w-full"
                                        value={sql}
                                        onChange={(e) => setSql(e.target.value)}
                                        placeholder="-- 输入 SQL 查询语句&#10;-- 例如: SELECT * FROM users LIMIT 10&#10;-- AI助手可以帮助您生成SQL语句"
                                        onKeyDown={(e) => {
                                            if (e.ctrlKey && e.key === 'Enter') {
                                                e.preventDefault();
                                                executeQuery();
                                            }
                                        }}
                                    />
                                    <div className="mt-4 flex justify-between items-center">
                                        <div className="text-sm text-gray-500">
                                            提示: 按 Ctrl+Enter 快速执行，使用AI助手生成SQL语句
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setSql('')}
                                                className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
                                            >
                                                清空
                                            </button>
                                            <button
                                                onClick={executeQuery}
                                                className="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all"
                                            >
                                                执行查询
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {queryResult && (
                                    <div className="card p-6">
                                        <h3 className="text-lg font-semibold mb-4">查询结果</h3>
                                        {queryResult.success ? (
                                            queryResult.data && queryResult.data.length > 0 ? (
                                                <DataTable
                                                    data={queryResult.data}
                                                    columns={Object.keys(queryResult.data[0]).map(key => ({ 
                                                        field: key, 
                                                        title: key 
                                                    }))}
                                                    pageSize={50}
                                                />
                                            ) : (
                                                <div className="text-center py-8 text-green-600">
                                                    查询执行成功，但没有返回数据
                                                </div>
                                            )
                                        ) : (
                                            <div className="bg-red-50 border border-red-200 rounded-lg overflow-hidden">
                                                <div className="p-4 bg-red-100 border-b border-red-200">
                                                    <div className="flex items-start gap-3">
                                                        <svg className="w-6 h-6 text-red-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                        </svg>
                                                        <div className="flex-1">
                                                            <h4 className="text-red-800 font-semibold text-lg">查询执行失败</h4>
                                                            <p className="text-red-700 text-sm mt-1">{queryResult.message}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <div className="p-4 space-y-3">
                                                    {queryResult.error && (
                                                        <div>
                                                            <p className="text-sm font-medium text-gray-700 mb-1">错误信息:</p>
                                                            <div className="bg-white border border-red-200 rounded p-3">
                                                                <code className="text-sm text-red-600 break-all">{queryResult.error}</code>
                                                            </div>
                                                        </div>
                                                    )}
                                                    
                                                    {queryResult.sql && (
                                                        <div>
                                                            <p className="text-sm font-medium text-gray-700 mb-1">执行的SQL语句:</p>
                                                            <div className="bg-gray-900 text-gray-100 rounded p-3 overflow-x-auto">
                                                                <pre className="text-sm font-mono">{queryResult.sql}</pre>
                                                            </div>
                                                        </div>
                                                    )}
                                                    
                                                    {queryResult.details && (
                                                        <details className="cursor-pointer">
                                                            <summary className="text-sm font-medium text-gray-700 hover:text-gray-900">
                                                                查看详细堆栈信息
                                                            </summary>
                                                            <div className="mt-2 bg-gray-100 rounded p-3 overflow-x-auto">
                                                                <pre className="text-xs text-gray-600">{queryResult.details}</pre>
                                                            </div>
                                                        </details>
                                                    )}
                                                    
                                                    {queryResult.timestamp && (
                                                        <div className="text-xs text-gray-500 pt-2 border-t">
                                                            发生时间: {queryResult.timestamp}
                                                        </div>
                                                    )}
                                                </div>
                                                
                                                <div className="px-4 py-3 bg-red-50 border-t border-red-200">
                                                    <p className="text-sm text-red-700">
                                                        💡 提示: 请检查SQL语法是否正确，表名和字段名是否存在，以及是否有相应的权限。
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Info Tab */}
                        {activeTab === 'info' && (
                            <div className="card p-6 fade-in">
                                <h3 className="text-lg font-semibold mb-6">数据库系统信息</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {[
                                        { label: '数据库名称', value: dbInfo.database },
                                        { label: '数据库大小', value: dbInfo.size },
                                        { label: '活跃连接数', value: dbInfo.connections },
                                        { label: '数据库版本', value: dbInfo.version, full: true }
                                    ].map((item, i) => (
                                        <div key={i} className={`p-4 bg-gray-50 rounded-lg ${item.full ? 'md:col-span-2' : ''}`}>
                                            <p className="text-sm text-gray-500 mb-1">{item.label}</p>
                                            <p className={`${item.full ? 'font-mono text-sm' : 'text-xl font-semibold'}`}>
                                                {item.value || '-'}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // 渲染应用
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
