<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 - 控制台</title>
    <script src="https://cdn.shushubuyue.net/ajax/libs/tailwindcss/3.4.16/tailwind.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.shushubuyue.net/ajax/libs/axios/1.7.2/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.shushubuyue.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastIn {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes toastOut {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        .toast-enter {
            animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .toast-exit {
            animation: toastOut 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out;
        }

        .animate-slideDown {
            animation: slideDown 0.3s ease-out;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* 输入框聚焦效果 */
        .input-field {
            transition: all 0.2s ease;
        }

        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* 按钮悬停效果 */
        .btn-primary {
            background: linear-gradient(135deg, #1e293b, #334155);
            transition: all 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 获取 URL 参数
        const getUrlParam = (name) => {
            const params = new URLSearchParams(globalThis.location.search);
            return params.get(name);
        };

        // Toast 通知组件
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';

            return (
                <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-slideDown z-50`}>
                    <i className={`fas ${icon}`}></i>
                    <span className="text-sm font-medium">{message}</span>
                </div>
            );
        }

        // 登录表单组件
        const LoginForm = () => {
            const [formData, setFormData] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [shake, setShake] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            // 获取重定向地址
            const redirectUrl = getUrlParam('redirect') || '/';

            // 显示提示
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            useEffect(() => {
                // 检查是否已登录
                const accessToken = localStorage.getItem('accessToken');
                if (accessToken) {
                    axios.get('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    }).then(() => {
                        globalThis.location.href = redirectUrl;
                    }).catch(() => {
                        localStorage.removeItem('accessToken');
                        localStorage.removeItem('refreshToken');
                        localStorage.removeItem('user');
                    });
                }
            }, []);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.username || !formData.password) {
                    showToast('请输入用户名和密码', 'error');
                    setShake(true);
                    setTimeout(() => setShake(false), 400);
                    return;
                }

                setLoading(true);
                
                const response = await axios.post('/api/auth/login', formData).catch(err => err.response);
                
                if (response?.data?.success) {
                    localStorage.setItem('accessToken', response.data.data.accessToken);
                    localStorage.setItem('refreshToken', response.data.data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(response.data.data.user));
                    
                    showToast('登录成功，正在跳转...', 'success');
                    setTimeout(() => {
                        globalThis.location.href = redirectUrl;
                    }, 800);
                } else {
                    showToast(response?.data?.message || '登录失败，请检查用户名和密码', 'error');
                    setShake(true);
                    setTimeout(() => setShake(false), 400);
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {/* Toast 通知 */}
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}

                    <div className={`w-full max-w-sm ${shake ? 'animate-shake' : ''}`}>
                        {/* 登录卡片 */}
                        <div className="glass rounded-2xl shadow-xl p-8 animate-fadeIn">
                            {/* Logo 和标题 */}
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-14 h-14 bg-slate-900 rounded-xl mb-4">
                                    <i className="fas fa-terminal text-xl text-white"></i>
                                </div>
                                <h1 className="text-xl font-semibold text-slate-900">
                                    登录控制台
                                </h1>
                                <p className="text-sm text-slate-500 mt-1">
                                    请输入您的账号信息
                                </p>
                            </div>

                            {/* 表单 */}
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1.5">
                                        用户名
                                    </label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                            <i className="fas fa-user text-slate-400 text-sm"></i>
                                        </div>
                                        <input 
                                            name="username"
                                            type="text"
                                            autoComplete="username"
                                            value={formData.username}
                                            onChange={handleChange}
                                            className="input-field block w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-400"
                                            placeholder="请输入用户名"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1.5">
                                        密码
                                    </label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                            <i className="fas fa-lock text-slate-400 text-sm"></i>
                                        </div>
                                        <input 
                                            name="password"
                                            type={showPassword ? 'text' : 'password'}
                                            autoComplete="current-password"
                                            value={formData.password}
                                            onChange={handleChange}
                                            className="input-field block w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-400"
                                            placeholder="请输入密码"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'} text-sm`}></i>
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full py-2.5 px-4 btn-primary text-white font-medium rounded-lg disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {loading ? (
                                        <>
                                            <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                            <span>登录中...</span>
                                        </>
                                    ) : (
                                        <>
                                            <span>登录</span>
                                            <i className="fas fa-arrow-right text-sm"></i>
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>

                        {/* 底部信息 */}
                        <p className="text-center text-xs text-slate-400 mt-6">
                            zhaojiu Proxy Console · Powered by <a href="https://www.haoaiganfan.top" target="_blank" class="haoaiganfan text-blue-500 hover:text-blue-600">zhaojiu</a>
                        </p>
                    </div>
                </div>
            );
        };

        // 主应用
        const App = () => <LoginForm />;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
