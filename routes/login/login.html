<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 - 控制台</title>
    <script src="https://cdn.shushubuyue.net/ajax/libs/tailwindcss/3.4.16/tailwind.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.shushubuyue.net/ajax/libs/axios/1.7.2/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.shushubuyue.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); }
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float 8s ease-in-out infinite;
            animation-delay: -2s;
        }

        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient-shift 8s ease infinite;
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -10px rgba(99, 102, 241, 0.5);
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50 to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 transition-colors duration-500">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="floating-shape w-96 h-96 bg-indigo-400 -top-48 -left-48 animate-float"></div>
        <div class="floating-shape w-80 h-80 bg-purple-400 top-1/4 -right-40 animate-float-delayed"></div>
        <div class="floating-shape w-64 h-64 bg-pink-400 bottom-20 left-1/4 animate-float"></div>
        <div class="floating-shape w-72 h-72 bg-blue-400 -bottom-36 right-1/4 animate-float-delayed"></div>
    </div>

    <div id="root" class="relative z-10 min-h-screen flex items-center justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 获取 URL 参数
        const getUrlParam = (name) => {
            const params = new URLSearchParams(globalThis.location.search);
            return params.get(name);
        };

        // 主题切换组件
        const ThemeToggle = () => {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                const savedTheme = localStorage.getItem('color-theme');
                const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
                const shouldBeDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
                
                setIsDark(shouldBeDark);
                document.documentElement.classList.toggle('dark', shouldBeDark);
            }, []);

            const toggleTheme = () => {
                const newIsDark = !isDark;
                setIsDark(newIsDark);
                document.documentElement.classList.toggle('dark', newIsDark);
                localStorage.setItem('color-theme', newIsDark ? 'dark' : 'light');
            };

            return (
                <button 
                    onClick={toggleTheme}
                    className="fixed top-6 right-6 p-3 rounded-2xl bg-white/80 dark:bg-slate-800/80 shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-110"
                >
                    {isDark ? (
                        <i className="fas fa-sun text-amber-500 text-lg"></i>
                    ) : (
                        <i className="fas fa-moon text-indigo-500 text-lg"></i>
                    )}
                </button>
            );
        };

        // 登录表单组件
        const LoginForm = () => {
            const [formData, setFormData] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState(false);
            const [shake, setShake] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            // 获取重定向地址
            const redirectUrl = getUrlParam('redirect') || '/';

            useEffect(() => {
                // 检查是否已登录
                const accessToken = localStorage.getItem('accessToken');
                if (accessToken) {
                    axios.get('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    }).then(() => {
                        globalThis.location.href = redirectUrl;
                    }).catch(() => {
                        localStorage.removeItem('accessToken');
                        localStorage.removeItem('refreshToken');
                        localStorage.removeItem('user');
                    });
                }
            }, []);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
                setError('');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.username || !formData.password) {
                    setError('请输入用户名和密码');
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    return;
                }

                setLoading(true);
                setError('');
                
                const response = await axios.post('/api/auth/login', formData).catch(err => err.response);
                
                if (response?.data?.success) {
                    localStorage.setItem('accessToken', response.data.data.accessToken);
                    localStorage.setItem('refreshToken', response.data.data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(response.data.data.user));
                    
                    setSuccess(true);
                    setTimeout(() => {
                        globalThis.location.href = redirectUrl;
                    }, 800);
                } else {
                    setError(response?.data?.message || '登录失败，请检查用户名和密码');
                    setShake(true);
                    setTimeout(() => setShake(false), 500);
                    setLoading(false);
                }
            };

            return (
                <div className={`w-full max-w-md ${shake ? 'animate-shake' : ''}`}>
                    <div className="glass-card rounded-3xl shadow-2xl p-8 md:p-10 animate-fadeInUp">
                        {/* Logo 和标题 */}
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl btn-gradient mb-6 shadow-lg">
                                <i className="fas fa-shield-halved text-3xl text-white"></i>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">
                                欢迎回来
                            </h1>
                            <p className="text-gray-500 dark:text-gray-400">
                                请登录您的账号以继续
                            </p>
                        </div>

                        {/* 错误提示 */}
                        {error && (
                            <div className="mb-6 p-4 rounded-xl bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 flex items-center gap-3">
                                <i className="fas fa-exclamation-circle text-red-500"></i>
                                <span className="text-red-600 dark:text-red-400 text-sm">{error}</span>
                            </div>
                        )}

                        {/* 成功提示 */}
                        {success && (
                            <div className="mb-6 p-4 rounded-xl bg-green-50 dark:bg-green-900/30 border border-green-100 dark:border-green-800 flex items-center gap-3">
                                <i className="fas fa-check-circle text-green-500"></i>
                                <span className="text-green-600 dark:text-green-400 text-sm">登录成功，正在跳转...</span>
                            </div>
                        )}

                        {/* 表单 */}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    用户名
                                </label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i className="fas fa-user text-gray-400"></i>
                                    </div>
                                    <input 
                                        name="username"
                                        type="text"
                                        required
                                        value={formData.username}
                                        onChange={handleChange}
                                        className="input-focus block w-full pl-12 pr-4 py-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                        placeholder="请输入用户名"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    密码
                                </label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i className="fas fa-lock text-gray-400"></i>
                                    </div>
                                    <input 
                                        name="password"
                                        type={showPassword ? 'text' : 'password'}
                                        required
                                        value={formData.password}
                                        onChange={handleChange}
                                        className="input-focus block w-full pl-12 pr-12 py-3.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                        placeholder="请输入密码"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
                                    >
                                        <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                    </button>
                                </div>
                            </div>

                            <div className="flex items-center justify-between">
                                <label className="flex items-center cursor-pointer">
                                    <input type="checkbox" className="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600" />
                                    <span className="ml-2 text-sm text-gray-600 dark:text-gray-400">记住我</span>
                                </label>
                            </div>

                            <button 
                                type="submit"
                                disabled={loading || success}
                                className="w-full py-4 px-6 btn-gradient text-white font-medium rounded-xl shadow-lg transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-3"
                            >
                                {success ? (
                                    <>
                                        <i className="fas fa-check-circle"></i>
                                        <span>登录成功</span>
                                    </>
                                ) : loading ? (
                                    <>
                                        <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                        <span>登录中...</span>
                                    </>
                                ) : (
                                    <>
                                        <i className="fas fa-arrow-right-to-bracket"></i>
                                        <span>登录</span>
                                    </>
                                )}
                            </button>
                        </form>
                    </div>

                    {/* 底部信息 */}
                    <p className="text-center text-sm text-gray-400 dark:text-gray-500 mt-8">
                        &copy; 2025 Gemini Proxy · All rights reserved
                    </p>
                </div>
            );
        };

        // 主应用
        const App = () => (
            <>
                <ThemeToggle />
                <LoginForm />
            </>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
